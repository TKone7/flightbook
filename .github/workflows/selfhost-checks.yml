name: Self-hosted checks

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable source revision to validate
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  checks:
    name: devenv checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - name: Check workflows and upstream merge automation
        run: devenv shell -- bash -c 'actionlint && python3 .github/scripts/test_upstream_sync.py'
      - name: Install locked application dependencies
        run: devenv shell -- flightbook-install
      - name: Build API and frontend
        run: devenv shell -- flightbook-build
      - name: Start isolated PostgreSQL/PostGIS
        run: devenv up -d postgres
      - name: Wait for PostgreSQL
        shell: devenv shell -- bash -e {0}
        run: |
          for attempt in {1..30}; do
            if pg_isready -q; then exit 0; fi
            sleep 1
          done
          echo 'PostgreSQL did not become ready' >&2
          exit 1
      - name: Check OIDC, migrations, sessions and signed URLs
        run: devenv shell -- flightbook-test-oidc
      - name: Check browser authentication, signed uploads and form inputs
        run: devenv shell -- flightbook-test-web
      - name: Stop PostgreSQL
        if: always()
        run: devenv down

